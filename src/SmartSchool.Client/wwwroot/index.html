<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartSchool</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link id="tabler-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/css/tabler.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <div class="boot-screen">
            <div class="boot-card">
                <div class="d-flex align-items-center gap-3">
                    <span class="brand-mark">S</span>
                    <div>
                        <div class="fw-bold">SmartSchool</div>
                        <div class="text-secondary small">Loading the administration workspace</div>
                    </div>
                </div>
                <div class="boot-progress"><div class="boot-progress-bar"></div></div>
                <div class="text-secondary small">Preparing the dashboard…</div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" class="alert alert-danger m-0 rounded-0">
        Something went wrong. <a href="" class="reload alert-link">Reload</a>
        <a class="dismiss float-end" role="button">✕</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/js/tabler.min.js"></script>
    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
